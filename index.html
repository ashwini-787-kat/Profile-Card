<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.min.css">
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container{
        height: 600px;
        border: 1px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .box{
        height: 80%;
        width: 80%;
        /* border: 1px solid black; */
        display: flex;
        box-shadow: 10px 10px 10px;
        border-radius: 20px;
    }
      .left,.center,.right{
        height: 100%;
        /* border: 1px solid black; */
      }
      .left{
        width: 3%;
        background-color: navy;
        border-radius: 10px;
      }
      .center{
        width: 62%;
        font-size: 55px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      h1{
        margin-left: 20px;
        color: navy;
      }
      .right{
        width: 35%;
      }
      .top{
        height: 30%;
        /* border: 1px solid black; */
      }
      .bottom{
        height: 70%;
       
         */
      }
      .top-in{
        height: 90%;
        background-color: navy;
      }
      .circle{
        height: 125px;
        width: 125px;
        border: 5px solid navy;
        border-radius: 50%;
        position: absolute;
        top: 80px;
        right: 330px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
       img{
        height: 100%;
        width: 100%;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 5px solid white;
       }
       .bottom>h1{
        text-align: center;
       }
       .button{
        color: white;
        /* border: 1px solid black; */
        display: flex;
       justify-content: space-evenly;
       align-items: center;
       }
       .button1{
        color: white;
        height: 50%;
        width: 40%;
        background-color: navy;
        border-radius: 20px;
        text-align: center;
        line-height: 30px;
       }
       .icon{
        height: 20%;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
       }
       .fa-facebook{
        color: blue;
       }
       .fa-github{
        color: violet;
       }
       .fa-instagram{
        background: linear-gradient(purple,red,orange);
        color: transparent;
        background-clip: text;
       }
       .fa-behance{
        color: green;
       }
       .fa-heart{
        color: red;
       }
       .fa-comment{
        color: blue;
       }
       .fa-share{
        color: green;
       }
</style>
<body>
    <div class="container">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="capture.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Website Developer</h1>
                    <h1>Dezyne École College</h1>
                    <h1>BCA 1st Year</h1>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-linkedin fa-2x"></i>
                        <i class="fa fa-brands fa-github fa-2x"></i>
                        <i class="fa fa-brands fa-behance fa-2x"></i>
                    </div>
                    <div class="button">
                        <div class="button1">Subscribe</div>
                        <div class="button1">Message</div>
                    </div>
                    <div class="icon">
                        <i class="fa fa-heart fa-2x"></i>60.4k
                        <i class="fa fa-comment fa-2x"></i>20k
                        <i class="fa fa-share fa-2x"></i>12.2k
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
